<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantieri — F4 Rilievi</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .two-col { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
    .rilievo-item {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px;
      border-bottom: 1px solid var(--c-border); cursor: pointer;
      transition: background var(--transition);
    }
    .rilievo-item:last-child { border-bottom: none; }
    .rilievo-item:hover { background: var(--c-bg); }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout">
  <main class="main-content">
    <div class="breadcrumb">
      <a href="clienti.html">Clienti</a> › <span id="bcCliente">—</span>
    </div>
    <div class="page-header">
      <div class="page-header-text">
        <h1 id="pageTitle">Cantieri</h1>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="openModalNuovoCantiere(null)">
          ➕ Nuovo cantiere
        </button>
      </div>
    </div>

    <div class="two-col">
      <!-- ALBERO -->
      <div class="card" style="padding:0;overflow:hidden;position:sticky;top:80px;">
        <div style="padding:12px 14px;border-bottom:1px solid var(--c-border);
                    display:flex;justify-content:space-between;align-items:center;
                    background:#F8F8F8;">
          <strong style="font-size:.9rem;">🏗️ Struttura cantieri</strong>
          <button class="btn btn-sm btn-outline" onclick="openModalNuovoCantiere(null)">+ Aggiungi</button>
        </div>
        <div id="alberoContainer" style="padding:8px;max-height:70vh;overflow-y:auto;">
          <div class="loading-state"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- DETTAGLIO -->
      <div id="dettaglioPanel">
        <div class="card">
          <div class="empty-state" style="padding:40px;">
            <div class="empty-icon">🏗️</div>
            <p>Seleziona un cantiere</p>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL CANTIERE -->
<div class="modal" id="modalCantiere">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modalCantiereTitle">Nuovo cantiere</span>
      <button class="modal-close" onclick="Utils.closeModal('modalCantiere')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Nome cantiere <span class="req">*</span></label>
        <input class="form-control" type="text" id="cantiereNome" placeholder="Es. Villa Rossi">
      </div>
      <div class="form-group">
        <label class="form-label">Cantiere padre (se sotto-cantiere)</label>
        <select class="form-control" id="cantierePadre">
          <option value="">— Nessuno (primo livello) —</option>
        </select>
      </div>
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Tipo via</label>
          <select class="form-control" id="cantiereTipoVia">
            <option value="">—</option>
            <option>Via</option><option>Piazza</option><option>Largo</option>
            <option>Viale</option><option>Corso</option><option>Strada</option>
            <option>Piazzale</option><option>Calle</option><option>Contrada</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Indirizzo</label>
          <input class="form-control" type="text" id="cantiereIndirizzo">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Comune</label>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input class="form-control" type="text" id="cantiereComuneInput"
                 placeholder="Digita il comune..." autocomplete="off"
                 oninput="cercaComune(this.value)">
          <div class="search-results" id="comuneResults"></div>
        </div>
      </div>
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Provincia</label>
          <input class="form-control" type="text" id="cantiereProv" maxlength="2" placeholder="es. PN">
        </div>
        <div class="form-group">
          <label class="form-label">CAP</label>
          <input class="form-control" type="text" id="cantiereCap" placeholder="es. 33170">
          <div class="form-hint">Modificabile anche dopo il suggerimento automatico</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Note</label>
        <textarea class="form-control" id="cantiereNote" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="Utils.closeModal('modalCantiere')">Annulla</button>
      <button class="btn btn-primary" id="btnSalvaCantiere" onclick="salvaCantiere()">Salva</button>
    </div>
  </div>
</div>

<!-- MODAL NUOVO RILIEVO -->
<div class="modal" id="modalNuovoRilievo">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Nuovo rilievo</span>
      <button class="modal-close" onclick="Utils.closeModal('modalNuovoRilievo')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Tipo rilievo <span class="req">*</span></label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="tipoRilievo" value="SERR" checked> 🪟 Serramenti</label>
          <label class="radio-opt"><input type="radio" name="tipoRilievo" value="PORTE"> 🚪 Porte interne</label>
        </div>
      </div>
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Referente <span class="req">*</span></label>
          <select class="form-control" id="rilievoReferente"><option value="">— Seleziona —</option></select>
        </div>
        <div class="form-group">
          <label class="form-label">Tipo intervento <span class="req">*</span></label>
          <select class="form-control" id="rilievoIntervento"><option value="">— Seleziona —</option></select>
        </div>
      </div>
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Data rilievo <span class="req">*</span></label>
          <input class="form-control" type="date" id="rilievoData">
        </div>
        <div class="form-group">
          <label class="form-label">Data posa prevista</label>
          <input class="form-control" type="date" id="rilievoPosa">
        </div>
      </div>
      <div class="form-group" id="gruGroup">
        <div class="checkbox-group">
          <input type="checkbox" id="rilievoGru">
          <label for="rilievoGru">🏗️ Utilizzo gru / autoscala sul cantiere</label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Note</label>
        <textarea class="form-control" id="rilievoNote" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="Utils.closeModal('modalNuovoRilievo')">Annulla</button>
      <button class="btn btn-primary" id="btnSalvaRilievo" onclick="salvaRilievo()">Crea rilievo</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script>
  const currentUser = Auth.requireLogin();
  if (!currentUser) throw new Error('not logged');
  Layout.init('clienti');

  const idCliente = Utils.getParam('idCliente');
  if (!idCliente) window.location.href = 'clienti.html';

  let cliente = null, alberoFlat = [], cantiereSelId = null;
  let cantiereEditId = null, rilievoTargetCantiere = null;
  let lookupRef = [], lookupInt = [];

  async function init() {
    const [resC, resA, resR, resI] = await Promise.all([
      API.getCliente(idCliente), API.getAlbero(idCliente),
      API.getLookup('LK_REFERENTI'), API.getLookup('LK_INTERVENTO')
    ]);
    if (!resC.success) { Utils.showError(resC.error); return; }
    cliente = resC.data;
    document.getElementById('bcCliente').textContent = cliente.nome;
    document.getElementById('pageTitle').textContent = cliente.nome;
    document.title = cliente.nome + ' — F4 Rilievi';
    lookupRef = resR.success ? resR.data : [];
    lookupInt = resI.success ? resI.data : [];
    if (resA.success) {
      alberoFlat = flattenTree(resA.data);
      renderAlbero(resA.data);
    }
    const idCant = Utils.getParam('idCantiere');
    if (idCant) selectCantiere(idCant);
  }

  // ALBERO
  function flattenTree(nodes, parent) {
    let r = [];
    nodes.forEach(n => {
      r.push({...n, _parent: parent||null});
      if (n.figli && n.figli.length) r = r.concat(flattenTree(n.figli, n.ID_cantiere));
    });
    return r;
  }

  function renderAlbero(nodes) {
    const c = document.getElementById('alberoContainer');
    if (!nodes || !nodes.length) {
      Utils.showEmptyState(c,'Nessun cantiere.','🏗️'); return;
    }
    const ul = document.createElement('ul');
    ul.className = 'tree-root';
    renderTreeNodes(nodes, ul);
    c.innerHTML = '';
    c.appendChild(ul);
  }

  function renderTreeNodes(nodes, parent) {
    nodes.forEach(node => {
      const li = document.createElement('li');
      li.className = 'tree-node-item';
      const hasFigli = node.figli && node.figli.length > 0;
      const attivo   = node.stato === 'attivo';
      li.innerHTML = `
        <div class="tree-node-row" id="tn_${node.ID_cantiere}"
             onclick="selectCantiere('${node.ID_cantiere}')">
          <button class="tree-toggle-btn" onclick="toggleNode(event,'${node.ID_cantiere}')">
            ${hasFigli ? '▼' : '&nbsp;'}
          </button>
          <span class="tree-node-icon">${hasFigli ? '📁' : '📍'}</span>
          <span class="tree-node-name" style="${!attivo?'opacity:.5;text-decoration:line-through;':''}">
            ${node.nome_cantiere}
            ${node.comune ? `<span class="tree-node-addr">${node.comune}</span>` : ''}
          </span>
          <div class="tree-node-actions">
            <button class="btn-icon" title="Sotto-cantiere"
                    onclick="openModalNuovoCantiere('${node.ID_cantiere}',event)">➕</button>
            <button class="btn-icon" title="Modifica"
                    onclick="openModalModificaCantiere('${node.ID_cantiere}',event)">✏️</button>
          </div>
        </div>
        ${hasFigli ? `<ul class="tree-children" id="tc_${node.ID_cantiere}"></ul>` : ''}
      `;
      parent.appendChild(li);
      if (hasFigli) {
        const childUl = li.querySelector(`#tc_${node.ID_cantiere}`);
        renderTreeNodes(node.figli, childUl);
      }
    });
  }

  function toggleNode(e, id) {
    e.stopPropagation();
    const ul = document.getElementById('tc_' + id);
    if (!ul) return;
    const open = ul.style.display !== 'none';
    ul.style.display = open ? 'none' : '';
    e.currentTarget.textContent = open ? '▶' : '▼';
  }

  async function selectCantiere(id) {
    cantiereSelId = id;
    document.querySelectorAll('.tree-node-row.selected').forEach(el => el.classList.remove('selected'));
    document.getElementById('tn_' + id)?.classList.add('selected');
    await renderDettaglio(id);
  }

  async function renderDettaglio(id) {
    const panel = document.getElementById('dettaglioPanel');
    panel.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';
    const [resCant, resRil] = await Promise.all([API.getCantiere(id), API.getRilievi(id)]);
    if (!resCant.success) { Utils.showError(resCant.error); return; }
    const c = resCant.data;
    const rilievi = resRil.success ? resRil.data : [];
    const serr  = rilievi.filter(r => r.tipo === 'SERR'  && r.stato !== 'eliminato');
    const porte = rilievi.filter(r => r.tipo === 'PORTE' && r.stato !== 'eliminato');

    panel.innerHTML = `
      <div class="card" style="margin-bottom:14px;">
        <div class="card-header">
          <span class="card-title">📍 ${c.nome_cantiere}</span>
          <button class="btn btn-sm btn-outline"
                  onclick="openModalModificaCantiere('${id}')">✏️ Modifica</button>
        </div>
        <div style="font-size:.85rem;color:var(--c-text-sec);line-height:1.8;">
          ${c.tipo_via||''} ${c.indirizzo||''}<br>
          ${c.comune ? c.comune+(c.provincia?' ('+c.provincia+')':'')+(c.CAP?' — '+c.CAP:'') : '<em>Indirizzo non specificato</em>'}
          ${c.breadcrumb ? '<br><span style="font-size:.76rem;">📂 '+c.breadcrumb+'</span>' : ''}
        </div>
      </div>

      <!-- RILIEVI SERR -->
      <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px;">
        <div style="padding:11px 14px;border-bottom:1px solid var(--c-border);
                    background:#E3F2FD;display:flex;justify-content:space-between;align-items:center;">
          <span style="font-weight:600;font-size:.9rem;">🪟 Rilievi Serramenti (${serr.length})</span>
          <button class="btn btn-sm btn-primary" onclick="openModalNuovoRilievo('${id}','SERR')">➕ Nuovo</button>
        </div>
        <div>${renderRilieviHTML(serr,'SERR')}</div>
      </div>

      <!-- RILIEVI PORTE -->
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="padding:11px 14px;border-bottom:1px solid var(--c-border);
                    background:#FFF3E0;display:flex;justify-content:space-between;align-items:center;">
          <span style="font-weight:600;font-size:.9rem;">🚪 Rilievi Porte Interne (${porte.length})</span>
          <button class="btn btn-sm btn-primary" onclick="openModalNuovoRilievo('${id}','PORTE')">➕ Nuovo</button>
        </div>
        <div>${renderRilieviHTML(porte,'PORTE')}</div>
      </div>
    `;
  }

  function renderRilieviHTML(lista, tipo) {
    if (!lista.length) return `<div style="padding:18px;text-align:center;color:var(--c-text-sec);font-size:.84rem;">
      Nessun rilievo. Clicca "+ Nuovo" per iniziare.</div>`;
    const page = tipo === 'SERR' ? 'rilievo_serr.html' : 'rilievo_porte.html';
    const icon = tipo === 'SERR' ? '🪟' : '🚪';
    return lista.map(r => `
      <div class="rilievo-item" onclick="Utils.navigate('${page}',{idRilievo:'${r.ID_rilievo}'})">
        <span style="font-size:1.3rem;">${icon}</span>
        <div style="flex:1;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="rilievo-code">${r.codice||'—'}</span>
            ${r.tipo_clone==='REVISIONE'?'<span class="badge badge-primary" style="font-size:.68rem;">REV</span>':''}
            ${r.tipo_clone==='COPIA'?'<span class="badge" style="font-size:.68rem;">COPIA</span>':''}
          </div>
          <div style="font-size:.78rem;color:var(--c-text-sec);margin-top:2px;">
            ${r.intervento||''} — ${r.data_rilievo||''}${r.referente?' — '+r.referente:''}
          </div>
        </div>
        <span style="color:var(--c-text-sec);">›</span>
      </div>`).join('');
  }

  // MODAL CANTIERE
  function openModalNuovoCantiere(parentId, event) {
    if (event) event.stopPropagation();
    cantiereEditId = null;
    document.getElementById('modalCantiereTitle').textContent = 'Nuovo cantiere';
    ['cantiereNome','cantiereTipoVia','cantiereIndirizzo','cantiereComuneInput',
     'cantiereProv','cantiereCap','cantiereNote'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    populatePadreSelect(parentId||'');
    Utils.openModal('modalCantiere');
    setTimeout(() => document.getElementById('cantiereNome').focus(), 100);
  }

  function openModalModificaCantiere(id, event) {
    if (event) event.stopPropagation();
    const c = alberoFlat.find(x => x.ID_cantiere == id);
    if (!c) return;
    cantiereEditId = id;
    document.getElementById('modalCantiereTitle').textContent = 'Modifica cantiere';
    document.getElementById('cantiereNome').value         = c.nome_cantiere  || '';
    document.getElementById('cantiereTipoVia').value      = c.tipo_via       || '';
    document.getElementById('cantiereIndirizzo').value    = c.indirizzo      || '';
    document.getElementById('cantiereComuneInput').value  = c.comune         || '';
    document.getElementById('cantiereProv').value         = c.provincia      || '';
    document.getElementById('cantiereCap').value          = c.CAP            || '';
    document.getElementById('cantiereNote').value         = c.note           || '';
    populatePadreSelect(c.ID_parent || '');
    Utils.openModal('modalCantiere');
  }

  function populatePadreSelect(selectedId) {
    const sel = document.getElementById('cantierePadre');
    sel.innerHTML = '<option value="">— Nessuno (primo livello) —</option>';
    alberoFlat.forEach(c => {
      if (cantiereEditId && c.ID_cantiere == cantiereEditId) return;
      const o = document.createElement('option');
      o.value = c.ID_cantiere;
      o.textContent = c.breadcrumb || c.nome_cantiere;
      if (String(c.ID_cantiere) === String(selectedId)) o.selected = true;
      sel.appendChild(o);
    });
  }

  async function salvaCantiere() {
    const nome   = document.getElementById('cantiereNome').value.trim();
    const comune = document.getElementById('cantiereComuneInput').value.trim();
    if (!nome) { Utils.showWarning('Nome cantiere obbligatorio.'); return; }
    const data = {
      ID_cliente:    idCliente,
      ID_parent:     document.getElementById('cantierePadre').value||'',
      nome_cantiere: nome,
      tipo_via:      document.getElementById('cantiereTipoVia').value,
      indirizzo:     document.getElementById('cantiereIndirizzo').value.trim(),
      comune:        comune,
      provincia:     document.getElementById('cantiereProv').value.trim().toUpperCase(),
      CAP:           document.getElementById('cantiereCap').value.trim(),
      note:          document.getElementById('cantiereNote').value.trim()
    };
    const btn = document.getElementById('btnSalvaCantiere');
    btn.disabled = true; btn.textContent = 'Salvataggio...';
    const res = cantiereEditId
      ? await API.updateCantiere(cantiereEditId, data)
      : await API.createCantiere(data);
    btn.disabled = false; btn.textContent = 'Salva';
    if (res.success) {
      Utils.showSuccess(cantiereEditId ? 'Cantiere aggiornato.' : 'Cantiere creato.');
      Utils.closeModal('modalCantiere');
      const resA = await API.getAlbero(idCliente);
      if (resA.success) {
        alberoFlat = flattenTree(resA.data);
        renderAlbero(resA.data);
        if (cantiereSelId) selectCantiere(cantiereSelId);
      }
    } else Utils.showError(res.error);
  }

  // AUTOCOMPLETE COMUNE
  const cercaComune = Utils.debounce(async function(q) {
    const box = document.getElementById('comuneResults');
    if (q.length < 2) { box.classList.remove('open'); return; }
    const res = await API.getComuni(q);
    if (!res.success || !res.data.length) { box.classList.remove('open'); return; }
    box.innerHTML = res.data.map(c => `
      <div class="search-result-item" onclick='selectComune(${JSON.stringify(c)})'>
        <div class="search-result-main">${c.comune}</div>
        <div class="search-result-sub">${c.provincia} — CAP ${c.CAP}</div>
      </div>`).join('');
    box.classList.add('open');
  }, 350);

  function selectComune(c) {
    document.getElementById('cantiereComuneInput').value = c.comune;
    document.getElementById('cantiereProv').value        = c.provincia;
    const capEl = document.getElementById('cantiereCap');
    if (!capEl.value) capEl.value = c.CAP;
    document.getElementById('comuneResults').classList.remove('open');
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-box'))
      document.getElementById('comuneResults')?.classList.remove('open');
  });

  // MODAL RILIEVO
  function openModalNuovoRilievo(idCantiere, tipo) {
    rilievoTargetCantiere = idCantiere;
    document.querySelectorAll('[name="tipoRilievo"]').forEach(r => r.checked = r.value === tipo);
    document.getElementById('gruGroup').style.display = tipo === 'SERR' ? '' : 'none';
    document.getElementById('rilievoData').valueAsDate = new Date();
    document.getElementById('rilievoPosa').value  = '';
    document.getElementById('rilievoGru').checked = false;
    document.getElementById('rilievoNote').value  = '';

    const selRef = document.getElementById('rilievoReferente');
    selRef.innerHTML = '<option value="">— Seleziona —</option>';
    lookupRef.forEach(r => {
      const o = document.createElement('option');
      o.value = r.nome_completo; o.textContent = r.nome_completo;
      if (currentUser && r.nome_completo === currentUser.nome) o.selected = true;
      selRef.appendChild(o);
    });
    const selInt = document.getElementById('rilievoIntervento');
    selInt.innerHTML = '<option value="">— Seleziona —</option>';
    lookupInt.forEach(i => {
      const o = document.createElement('option');
      o.value = i.descrizione; o.textContent = i.descrizione;
      selInt.appendChild(o);
    });
    Utils.openModal('modalNuovoRilievo');
  }

  async function salvaRilievo() {
    const tipo     = document.querySelector('[name="tipoRilievo"]:checked')?.value;
    const ref      = document.getElementById('rilievoReferente').value;
    const interv   = document.getElementById('rilievoIntervento').value;
    const dataR    = document.getElementById('rilievoData').value;
    if (!ref || !interv || !dataR) { Utils.showWarning('Compila tutti i campi obbligatori.'); return; }

    const data = {
      ID_cantiere:  rilievoTargetCantiere, tipo, referente: ref,
      intervento:   interv, data_rilievo: dataR,
      data_posa:    document.getElementById('rilievoPosa').value||'',
      gru:          tipo==='SERR' && document.getElementById('rilievoGru').checked ? 'SI' : 'NO',
      note:         document.getElementById('rilievoNote').value.trim()
    };
    const btn = document.getElementById('btnSalvaRilievo');
    btn.disabled = true; btn.textContent = 'Creazione...';
    const res = await API.createRilievo(data);
    btn.disabled = false; btn.textContent = 'Crea rilievo';

    if (res.success) {
      Utils.showSuccess('Rilievo ' + res.codice + ' creato.');
      Utils.closeModal('modalNuovoRilievo');
      Utils.navigate(tipo==='SERR'?'rilievo_serr.html':'rilievo_porte.html', {idRilievo: res.id});
    } else Utils.showError(res.error);
  }

  // Update gruGroup on tipo change
  document.querySelectorAll('[name="tipoRilievo"]').forEach(r => {
    r.addEventListener('change', e => {
      document.getElementById('gruGroup').style.display = e.target.value==='SERR' ? '' : 'none';
    });
  });

  init();
</script>
</body>
