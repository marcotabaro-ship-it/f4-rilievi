<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clienti &mdash; F4 Rilievi</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="app-layout" id="appLayout">
  <main class="main-content">
    <div class="page-header">
      <div class="page-header-text">
        <h1>Clienti</h1>
        <p class="page-subtitle">Gestione anagrafiche clienti e cantieri</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="openModalNuovoCliente()">&#10133; Nuovo cliente</button>
      </div>
    </div>

    <div class="card" style="padding:14px;margin-bottom:16px;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <div class="search-box" style="flex:1;min-width:200px;">
          <span class="search-icon">&#128269;</span>
          <input class="form-control" type="text" id="searchInput"
                 placeholder="Cerca per nome cliente..." oninput="applyFilters()">
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
          <label style="font-size:.82rem;color:var(--c-text-sec);white-space:nowrap;">Referente:</label>
          <select class="form-control" id="filterReferente" style="min-width:160px;" onchange="applyFilters()">
            <option value="">— Tutti —</option>
          </select>
        </div>
      </div>
    </div>

    <div id="clientiList">
      <div class="loading-state"><div class="spinner"></div><p>Caricamento clienti...</p></div>
    </div>
  </main>
</div>

<!-- MODAL CLIENTE -->
<div class="modal" id="modalCliente">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modalClienteTitle">Nuovo cliente</span>
      <button class="modal-close" onclick="Utils.closeModal('modalCliente')">&#10005;</button>
    </div>
    <div class="modal-body">

      <!-- DATI ANAGRAFICI -->
      <div style="font-size:.78rem;font-weight:700;color:var(--c-primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;">&#128100; Anagrafica</div>
      <div class="form-group">
        <label class="form-label">Nome / Ragione sociale <span class="req">*</span></label>
        <input class="form-control" type="text" id="clienteNome" placeholder="Es. Rossi Mario">
      </div>
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Telefono</label>
          <input class="form-control" type="tel" id="clienteTel" placeholder="es. 0434 000000">
        </div>
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input class="form-control" type="email" id="clienteEmail">
        </div>
      </div>

      <!-- INDIRIZZO -->
      <div style="font-size:.78rem;font-weight:700;color:var(--c-primary);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 10px;padding-top:10px;border-top:1px solid var(--c-border);">&#128205; Indirizzo di residenza / sede</div>
      <div class="form-hint" style="margin-bottom:10px;">
        Questo indirizzo viene proposto come predefinito quando si crea un nuovo cantiere.
      </div>
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Tipo via</label>
          <select class="form-control" id="clienteTipoVia">
            <option value="">—</option>
            <option>Via</option><option>Piazza</option><option>Largo</option>
            <option>Viale</option><option>Corso</option><option>Strada</option>
            <option>Piazzale</option><option>Calle</option><option>Contrada</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Indirizzo</label>
          <input class="form-control" type="text" id="clienteIndirizzo" placeholder="es. Roma, 12">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Comune</label>
        <div class="search-box">
          <span class="search-icon">&#128269;</span>
          <input class="form-control" type="text" id="clienteComuneInput"
                 placeholder="Digita il comune..." autocomplete="off"
                 oninput="cercaComuneCliente(this.value)">
          <div class="search-results" id="clienteComuneResults"></div>
        </div>
      </div>
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Provincia</label>
          <input class="form-control" type="text" id="clienteProv" maxlength="2" placeholder="es. PN">
        </div>
        <div class="form-group">
          <label class="form-label">CAP</label>
          <input class="form-control" type="text" id="clienteCap" placeholder="es. 33170">
        </div>
      </div>

      <!-- NOTE -->
      <div class="form-group" style="margin-top:4px;">
        <label class="form-label">Note</label>
        <textarea class="form-control" id="clienteNote" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="Utils.closeModal('modalCliente')">Annulla</button>
      <button class="btn btn-primary" id="btnSalvaCliente" onclick="salvaCliente()">Salva</button>
    </div>
  </div>
</div>

<!-- MODAL CONFERMA TOGGLE -->
<div class="modal" id="modalToggle">
  <div class="modal-box modal-box-sm">
    <div class="modal-header">
      <span class="modal-title" id="toggleTitle">Conferma</span>
      <button class="modal-close" onclick="Utils.closeModal('modalToggle')">&#10005;</button>
    </div>
    <div class="modal-body"><p id="toggleMsg"></p></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="Utils.closeModal('modalToggle')">Annulla</button>
      <button class="btn btn-danger" id="btnConfermaToggle">Conferma</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script>
var currentUser = Auth.requireLogin();
if (!currentUser) throw new Error('not logged');
Layout.init('clienti');

var tuttiClienti = [];
var clienteEditId = null;
var referentiMap = {}; // { ID_cliente: ['Ref1','Ref2'] }

async function init() {
  var results = await Promise.all([
    API.getClienti(),
    API.getRilieviTutti('SERR'),
    API.getRilieviTutti('PORTE')
  ]);
  var resC = results[0], resS = results[1], resP = results[2];
  if (!resC.success) { Utils.showError(resC.error); return; }
  tuttiClienti = resC.data;

  // Costruisci mappa referenti per cliente
  referentiMap = {};
  var allRilievi = [];
  if (resS.success) allRilievi = allRilievi.concat(resS.data);
  if (resP.success) allRilievi = allRilievi.concat(resP.data);
  allRilievi.forEach(function(r) {
    if (!r.referente || !r.id_cantiere) return;
    // Trovo il cliente tramite cantiere
    // I dati rilievo hanno id_cantiere, ma non ID_cliente direttamente
    // uso un workaround: dopo il render mappo via api separata
  });

  // Carica referenti via query diretta rilievi + cantieri
  caricaReferenti();
  renderClienti(tuttiClienti);
  applyFilters();
}

async function caricaReferenti() {
  // Query: rilievi con join cantieri per avere ID_cliente
  var SU = APP_CONFIG.SUPABASE_URL, SK = APP_CONFIG.SUPABASE_ANON_KEY;
  var tok = (typeof Auth !== 'undefined' && Auth.getToken) ? Auth.getToken() : SK;
  var url = SU + '/rest/v1/rilievi?stato=neq.archiviato&select=referente,cantieri(id_cliente)';
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, false); // sincrono solo per semplicita
    xhr.setRequestHeader('apikey', SK);
    xhr.setRequestHeader('Authorization', 'Bearer ' + (tok || SK));
    xhr.send();
    if (xhr.status >= 200 && xhr.status < 300) {
      var rows = JSON.parse(xhr.responseText);
      referentiMap = {};
      rows.forEach(function(r) {
        if (!r.referente || !r.cantieri) return;
        var idC = r.cantieri.id_cliente || r.cantieri.ID_cliente;
        if (!idC) return;
        idC = String(idC);
        if (!referentiMap[idC]) referentiMap[idC] = [];
        if (referentiMap[idC].indexOf(r.referente) < 0) referentiMap[idC].push(r.referente);
      });
      // Aggiorna select referenti
      var allRef = [];
      Object.values(referentiMap).forEach(function(arr) {
        arr.forEach(function(r) { if (allRef.indexOf(r) < 0) allRef.push(r); });
      });
      allRef.sort();
      var sel = document.getElementById('filterReferente');
      if (sel) {
        sel.innerHTML = '<option value="">— Tutti —</option>' +
          allRef.map(function(r) { return '<option value="' + r + '">' + r + '</option>'; }).join('');
      }
      // Ri-renderizza con referenti
      applyFilters();
    }
  } catch(e) { console.warn('caricaReferenti:', e); }
}

function filterClienti(q) { applyFilters(); }

function applyFilters() {
  var q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  var ref = (document.getElementById('filterReferente').value || '').trim();
  var lista = tuttiClienti.filter(function(c) {
    var matchQ = !q || (c.nome||'').toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q) || (c.comune||'').toLowerCase().includes(q);
    var matchRef = !ref || (referentiMap[String(c.ID_cliente)] || []).indexOf(ref) >= 0;
    return matchQ && matchRef;
  });
  renderClienti(lista);
}

function renderClienti(lista) {
  var container = document.getElementById('clientiList');
  if (!lista.length) { Utils.showEmptyState(container,'Nessun cliente trovato.','&#128101;'); return; }
  var sorted = Utils.sortByName(lista,'nome');
  container.innerHTML = sorted.map(function(c) {
    var attivo = c.stato === 'attivo';
    var addrStr = [c.tipo_via, c.indirizzo].filter(Boolean).join(' ').trim();
    var locStr  = [c.comune, c.provincia ? '('+c.provincia+')' : ''].filter(Boolean).join(' ').trim();
    var addrLine = [addrStr, locStr, c.cap].filter(Boolean).join(' \u2014 ');
    var contatti = [c.telefono ? '&#128222; '+c.telefono : '', c.email ? '&#9993;&#65039; '+c.email : ''].filter(Boolean).join('&nbsp;&nbsp;');
    return '<div class="card" style="margin-bottom:8px;padding:0;overflow:hidden;">' +
      '<div style="display:flex;align-items:stretch;">' +
        '<div style="width:52px;background:'+(attivo?'var(--c-primary)':'var(--c-text-sec)')+';display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:1.2rem;flex-shrink:0;">' +
          (c.nome||'?').charAt(0).toUpperCase() +
        '</div>' +
        '<div style="flex:1;padding:10px 14px;cursor:pointer;" onclick="Utils.navigate(\'cantiere.html\',{idCliente:\''+c.ID_cliente+'\'})">' +
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
            '<strong>'+c.nome+'</strong>' +
            '<span class="badge '+(attivo?'badge-attivo':'badge-obsoleto')+'">'+(attivo?'Attivo':'Non attivo')+'</span>' +
          '</div>' +
          '<div style="font-size:.79rem;color:var(--c-text-sec);margin-top:2px;">' + (contatti||'Nessun contatto') + '</div>' +
          (referentiMap[String(c.ID_cliente)] ? '<div style="font-size:.76rem;color:var(--c-primary);margin-top:1px;">&#128100; ' + referentiMap[String(c.ID_cliente)].join(' &middot; ') + '</div>' : '') +
          (addrLine ? '<div style="font-size:.76rem;color:var(--c-text-sec);">&#128205; '+addrLine+'</div>' : '') +
        '</div>' +
        '<div style="padding:0 10px;display:flex;align-items:center;gap:4px;">' +
          '<button class="btn btn-sm btn-outline" title="Cantieri" onclick="Utils.navigate(\'cantiere.html\',{idCliente:\''+c.ID_cliente+'\'})">&#127959;</button>' +
          '<button class="btn-icon" title="Modifica" onclick="openModalModifica(\''+c.ID_cliente+'\')">&#9999;&#65039;</button>' +
          (Auth.isAdmin() ? '<button class="btn-icon" title="'+(attivo?'Disattiva':'Riattiva')+'" onclick="confermaToggle(\''+c.ID_cliente+'\',\''+c.nome.replace(/'/g,"\\'")+'\','+attivo+')">'+(attivo?'&#128308;':'&#128994;')+'</button>' : '') +
        '</div>' +
      '</div></div>';
  }).join('');
}

function openModalNuovoCliente() {
  clienteEditId = null;
  document.getElementById('modalClienteTitle').textContent = 'Nuovo cliente';
  ['clienteNome','clienteTel','clienteEmail','clienteNote',
   'clienteIndirizzo','clienteComuneInput','clienteProv','clienteCap'].forEach(function(id) {
    var el = document.getElementById(id); if(el) el.value = '';
  });
  document.getElementById('clienteTipoVia').value = '';
  Utils.openModal('modalCliente');
  setTimeout(function() { document.getElementById('clienteNome').focus(); }, 100);
}

function openModalModifica(id) {
  var c = tuttiClienti.find(function(x) { return x.ID_cliente == id; });
  if (!c) return;
  clienteEditId = id;
  document.getElementById('modalClienteTitle').textContent = 'Modifica cliente';
  document.getElementById('clienteNome').value         = c.nome      || '';
  document.getElementById('clienteTel').value          = c.telefono  || '';
  document.getElementById('clienteEmail').value        = c.email     || '';
  document.getElementById('clienteNote').value         = c.note      || '';
  document.getElementById('clienteTipoVia').value      = c.tipo_via  || '';
  document.getElementById('clienteIndirizzo').value    = c.indirizzo || '';
  document.getElementById('clienteComuneInput').value  = c.comune    || '';
  document.getElementById('clienteProv').value         = c.provincia || '';
  document.getElementById('clienteCap').value          = c.cap       || '';
  Utils.openModal('modalCliente');
  setTimeout(function() { document.getElementById('clienteNome').focus(); }, 100);
}

async function salvaCliente() {
  var nome = document.getElementById('clienteNome').value.trim();
  if (!nome) { Utils.showWarning('Nome obbligatorio.'); return; }
  var data = {
    nome:      nome,
    telefono:  document.getElementById('clienteTel').value.trim(),
    email:     document.getElementById('clienteEmail').value.trim(),
    note:      document.getElementById('clienteNote').value.trim(),
    tipo_via:  document.getElementById('clienteTipoVia').value,
    indirizzo: document.getElementById('clienteIndirizzo').value.trim(),
    comune:    document.getElementById('clienteComuneInput').value.trim(),
    provincia: document.getElementById('clienteProv').value.trim().toUpperCase(),
    cap:       document.getElementById('clienteCap').value.trim()
  };
  var btn = document.getElementById('btnSalvaCliente');
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  var res = clienteEditId ? await API.updateCliente(clienteEditId, data) : await API.createCliente(data);
  btn.disabled = false; btn.textContent = 'Salva';
  if (res.success) {
    Utils.showSuccess(clienteEditId ? 'Cliente aggiornato.' : 'Cliente creato.');
    Utils.closeModal('modalCliente');
    await init();
  } else Utils.showError(res.error);
}

// Autocomplete comune
var cercaComuneCliente = Utils.debounce(async function(q) {
  var box = document.getElementById('clienteComuneResults');
  if (q.length < 2) { box.classList.remove('open'); return; }
  var res = await API.getComuni(q);
  if (!res.success || !res.data.length) { box.classList.remove('open'); return; }
  box.innerHTML = res.data.map(function(c) {
    return '<div class="search-result-item" onclick=\'selComuneCliente('+JSON.stringify(c)+')\' >' +
      '<div class="search-result-main">'+c.comune+'</div>' +
      '<div class="search-result-sub">'+c.provincia+' \u2014 CAP '+c.CAP+'</div></div>';
  }).join('');
  box.classList.add('open');
}, 350);

function selComuneCliente(c) {
  document.getElementById('clienteComuneInput').value = c.comune;
  document.getElementById('clienteProv').value        = c.provincia;
  var capEl = document.getElementById('clienteCap');
  if (!capEl.value) capEl.value = c.CAP;
  document.getElementById('clienteComuneResults').classList.remove('open');
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.search-box')) {
    var el = document.getElementById('clienteComuneResults'); if (el) el.classList.remove('open');
  }
});

function confermaToggle(id, nome, attivo) {
  document.getElementById('toggleTitle').textContent = attivo ? 'Disattiva cliente' : 'Riattiva cliente';
  document.getElementById('toggleMsg').textContent   = attivo ? 'Vuoi disattivare "'+nome+'"?' : 'Vuoi riattivare "'+nome+'"?';
  document.getElementById('btnConfermaToggle').onclick = async function() {
    Utils.closeModal('modalToggle');
    var res = await API.toggleCliente(id);
    if (res.success) { Utils.showSuccess('Stato aggiornato.'); await init(); }
    else Utils.showError(res.error);
  };
  Utils.openModal('modalToggle');
}

init();
</script>
</body>
</html>
