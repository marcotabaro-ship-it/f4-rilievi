<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clienti — F4 Rilievi</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="app-layout" id="appLayout">
  <main class="main-content">
    <div class="page-header">
      <div class="page-header-text">
        <h1>Clienti</h1>
        <p class="page-subtitle">Gestione anagrafiche clienti e cantieri</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="openModalNuovoCliente()">➕ Nuovo cliente</button>
      </div>
    </div>

    <div class="card" style="padding:14px;margin-bottom:16px;">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input class="form-control" type="text" id="searchInput"
               placeholder="Cerca per nome cliente..." oninput="filterClienti(this.value)">
      </div>
    </div>

    <div id="clientiList">
      <div class="loading-state"><div class="spinner"></div><p>Caricamento clienti...</p></div>
    </div>
  </main>
</div>

<!-- MODAL CLIENTE -->
<div class="modal" id="modalCliente">
  <div class="modal-box modal-box-sm">
    <div class="modal-header">
      <span class="modal-title" id="modalClienteTitle">Nuovo cliente</span>
      <button class="modal-close" onclick="Utils.closeModal('modalCliente')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Nome / Ragione sociale <span class="req">*</span></label>
        <input class="form-control" type="text" id="clienteNome" placeholder="Es. Rossi Mario">
      </div>
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="form-label">Telefono</label>
          <input class="form-control" type="tel" id="clienteTel">
        </div>
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input class="form-control" type="email" id="clienteEmail">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Note</label>
        <textarea class="form-control" id="clienteNote" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="Utils.closeModal('modalCliente')">Annulla</button>
      <button class="btn btn-primary" id="btnSalvaCliente" onclick="salvaCliente()">Salva</button>
    </div>
  </div>
</div>

<!-- MODAL CONFERMA TOGGLE -->
<div class="modal" id="modalToggle">
  <div class="modal-box modal-box-sm">
    <div class="modal-header">
      <span class="modal-title" id="toggleTitle">Conferma</span>
      <button class="modal-close" onclick="Utils.closeModal('modalToggle')">✕</button>
    </div>
    <div class="modal-body"><p id="toggleMsg"></p></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="Utils.closeModal('modalToggle')">Annulla</button>
      <button class="btn btn-danger" id="btnConfermaToggle">Conferma</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script>
  const currentUser = Auth.requireLogin();
  if (!currentUser) throw new Error('not logged');
  Layout.init('clienti');

  let tuttiClienti = [];
  let clienteEditId = null;

  async function init() {
    const res = await API.getClienti();
    if (!res.success) { Utils.showError(res.error); return; }
    tuttiClienti = res.data;
    renderClienti(tuttiClienti);
  }

  function filterClienti(q) {
    q = q.trim().toLowerCase();
    renderClienti(q ? tuttiClienti.filter(c =>
      (c.nome||'').toLowerCase().includes(q) ||
      (c.email||'').toLowerCase().includes(q)
    ) : tuttiClienti);
  }

  function renderClienti(lista) {
    const container = document.getElementById('clientiList');
    if (!lista.length) {
      Utils.showEmptyState(container,'Nessun cliente trovato.','👥'); return;
    }
    const sorted = Utils.sortByName(lista,'nome');
    container.innerHTML = sorted.map(c => {
      const attivo = c.stato === 'attivo';
      return `
        <div class="card" style="margin-bottom:8px;padding:0;overflow:hidden;">
          <div style="display:flex;align-items:stretch;">
            <div style="width:52px;background:${attivo?'var(--c-primary)':'var(--c-text-sec)'};
                        display:flex;align-items:center;justify-content:center;
                        color:white;font-weight:700;font-size:1.2rem;flex-shrink:0;">
              ${(c.nome||'?').charAt(0).toUpperCase()}
            </div>
            <div style="flex:1;padding:12px 14px;cursor:pointer;"
                 onclick="Utils.navigate('cantiere.html',{idCliente:'${c.ID_cliente}'})">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <strong>${c.nome}</strong>
                <span class="badge ${attivo?'badge-attivo':'badge-obsoleto'}">
                  ${attivo?'Attivo':'Non attivo'}
                </span>
              </div>
              <div style="font-size:.8rem;color:var(--c-text-sec);margin-top:3px;">
                ${c.telefono?'📞 '+c.telefono+' ':''}${c.email?'✉️ '+c.email:''}
                ${!c.telefono&&!c.email?'Nessun contatto registrato':''}
              </div>
            </div>
            <div style="padding:0 10px;display:flex;align-items:center;gap:4px;">
              <button class="btn btn-sm btn-outline" title="Cantieri"
                      onclick="Utils.navigate('cantiere.html',{idCliente:'${c.ID_cliente}'})">
                🏗️
              </button>
              <button class="btn-icon" title="Modifica"
                      onclick="openModalModifica('${c.ID_cliente}')">✏️</button>
              ${Auth.isAdmin() ? `
              <button class="btn-icon" title="${attivo?'Disattiva':'Riattiva'}"
                      onclick="confermaToggle('${c.ID_cliente}','${c.nome.replace(/'/g,"\\'")}',${attivo})">
                ${attivo?'🔴':'🟢'}
              </button>` : ''}
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function openModalNuovoCliente() {
    clienteEditId = null;
    document.getElementById('modalClienteTitle').textContent = 'Nuovo cliente';
    document.getElementById('clienteNome').value  = '';
    document.getElementById('clienteTel').value   = '';
    document.getElementById('clienteEmail').value = '';
    document.getElementById('clienteNote').value  = '';
    Utils.openModal('modalCliente');
    setTimeout(() => document.getElementById('clienteNome').focus(), 100);
  }

  function openModalModifica(id) {
    const c = tuttiClienti.find(x => x.ID_cliente == id);
    if (!c) return;
    clienteEditId = id;
    document.getElementById('modalClienteTitle').textContent = 'Modifica cliente';
    document.getElementById('clienteNome').value  = c.nome     || '';
    document.getElementById('clienteTel').value   = c.telefono || '';
    document.getElementById('clienteEmail').value = c.email    || '';
    document.getElementById('clienteNote').value  = c.note     || '';
    Utils.openModal('modalCliente');
    setTimeout(() => document.getElementById('clienteNome').focus(), 100);
  }

  async function salvaCliente() {
    const nome = document.getElementById('clienteNome').value.trim();
    if (!nome) { Utils.showWarning('Nome obbligatorio.'); return; }
    const data = {
      nome, telefono: document.getElementById('clienteTel').value.trim(),
      email: document.getElementById('clienteEmail').value.trim(),
      note:  document.getElementById('clienteNote').value.trim()
    };
    const btn = document.getElementById('btnSalvaCliente');
    btn.disabled = true; btn.textContent = 'Salvataggio...';
    const res = clienteEditId
      ? await API.updateCliente(clienteEditId, data)
      : await API.createCliente(data);
    btn.disabled = false; btn.textContent = 'Salva';
    if (res.success) {
      Utils.showSuccess(clienteEditId ? 'Cliente aggiornato.' : 'Cliente creato.');
      Utils.closeModal('modalCliente');
      await init();
    } else { Utils.showError(res.error); }
  }

  function confermaToggle(id, nome, attivo) {
    document.getElementById('toggleTitle').textContent = attivo ? 'Disattiva cliente' : 'Riattiva cliente';
    document.getElementById('toggleMsg').textContent   = attivo
      ? `Vuoi disattivare "${nome}"?`
      : `Vuoi riattivare "${nome}"?`;
    document.getElementById('btnConfermaToggle').onclick = async () => {
      Utils.closeModal('modalToggle');
      const res = await API.toggleCliente(id);
      if (res.success) { Utils.showSuccess('Stato aggiornato.'); await init(); }
      else Utils.showError(res.error);
    };
    Utils.openModal('modalToggle');
  }

  init();
</script>
</body>
</html>
