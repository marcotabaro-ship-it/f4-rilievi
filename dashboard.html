<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — F4 Rilievi</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="app-layout" id="appLayout">
  <main class="main-content">
    <div class="page-header">
      <div class="page-header-text">
        <h1>Dashboard</h1>
        <p class="page-subtitle">Benvenuto, <strong data-user-nome>—</strong></p>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-value" id="kpiClienti">—</div>
        <div class="kpi-label">Clienti attivi</div>
      </div>
      <div class="kpi-card kpi-red">
        <div class="kpi-value" id="kpiRilieviSerr">—</div>
        <div class="kpi-label">Rilievi Serramenti</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value" id="kpiRilieviPorte">—</div>
        <div class="kpi-label">Rilievi Porte</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Clienti recenti</span>
        <a href="clienti.html" class="btn btn-sm btn-outline">Tutti i clienti →</a>
      </div>
      <div id="clientiRecenti">
        <div class="loading-state"><div class="spinner"></div><p>Caricamento...</p></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">Azioni rapide</span></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="Utils.navigate('clienti.html')">
          ➕ Nuovo cliente
        </button>
        <button class="btn btn-secondary" onclick="Utils.navigate('clienti.html')">
          🔍 Cerca cantiere
        </button>
      </div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script>
  const currentUser = Auth.requireLogin();
  if (currentUser) {
    Layout.init('dashboard');
    loadDashboard();
  }

  async function loadDashboard() {
    const res = await API.getClienti();
    if (!res.success) { Utils.showError(res.error); return; }
    const clienti = res.data.filter(c => c.stato === 'attivo');
    document.getElementById('kpiClienti').textContent = clienti.length;
    document.getElementById('kpiRilieviSerr').textContent = '—';
    document.getElementById('kpiRilieviPorte').textContent = '—';

    const container = document.getElementById('clientiRecenti');
    if (clienti.length === 0) {
      Utils.showEmptyState(container, 'Nessun cliente. Clicca "Nuovo cliente" per iniziare.', '👥');
      return;
    }
    const recent = Utils.sortByName(clienti, 'nome').slice(0, 6);
    container.innerHTML = recent.map(c => `
      <div class="pos-card" style="cursor:pointer;"
           onclick="Utils.navigate('cantiere.html',{idCliente:'${c.ID_cliente}'})">
        <div class="pos-num" style="background:var(--c-red)">
          ${(c.nome||'?').charAt(0).toUpperCase()}
        </div>
        <div class="pos-info">
          <div class="pos-title">${c.nome}</div>
          <div class="pos-subtitle">${c.telefono||''} ${c.email||''}</div>
        </div>
        <span style="color:var(--c-text-sec)">›</span>
      </div>
    `).join('');
  }
</script>
</body>
</html>
