<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard &mdash; F4 Rilievi</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="app-layout" id="appLayout">
  <main class="main-content">
    <div class="page-header">
      <div class="page-header-text">
        <h1>Dashboard</h1>
        <p class="page-subtitle">Benvenuto, <strong data-user-nome>—</strong></p>
      </div>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-value" id="kpiClienti">—</div>
        <div class="kpi-label">Clienti attivi</div>
      </div>
      <div class="kpi-card kpi-red">
        <div class="kpi-value" id="kpiRilieviSerr">—</div>
        <div class="kpi-label">Rilievi Serramenti</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value" id="kpiRilieviPorte">—</div>
        <div class="kpi-label">Rilievi Porte</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">Clienti recenti</span>
        <a href="clienti.html" class="btn btn-sm btn-outline">Tutti i clienti &#8594;</a>
      </div>
      <div id="clientiRecenti">
        <div class="loading-state"><div class="spinner"></div><p>Caricamento...</p></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Azioni rapide</span></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="Utils.navigate('clienti.html')">
          &#10133; Nuovo cliente
        </button>
        <button class="btn btn-secondary" onclick="Utils.navigate('clienti.html')">
          &#128269; Cerca cantiere
        </button>
        <button class="btn btn-outline" onclick="window.open('formule.html','_blank')">
          &#128220; Formule di calcolo
        </button>
        <button class="btn btn-outline" onclick="window.open('guida.html','_blank')">
          &#10067; Guida utilizzo
        </button>
      </div>
    </div>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script>
var currentUser = Auth.requireLogin();
if (currentUser) {
  Layout.init('dashboard');
  loadDashboard();
}

async function loadDashboard() {
  // Carico clienti, rilievi serr e rilievi porte in parallelo
  var results = await Promise.all([
    API.getClienti(),
    API.getRilieviTutti('SERR'),
    API.getRilieviTutti('PORTE')
  ]);

  var resClienti = results[0];
  var resSerr    = results[1];
  var resPorte   = results[2];

  if (!resClienti.success) { Utils.showError(resClienti.error); return; }

  var clienti = resClienti.data.filter(function(c) { return c.stato === 'attivo'; });
  document.getElementById('kpiClienti').textContent = clienti.length;

  // KPI rilievi
  var nSerr  = resSerr.success  ? resSerr.data.length  : 0;
  var nPorte = resPorte.success ? resPorte.data.length : 0;
  document.getElementById('kpiRilieviSerr').textContent  = nSerr;
  document.getElementById('kpiRilieviPorte').textContent = nPorte;

  // Clienti recenti
  var container = document.getElementById('clientiRecenti');
  if (!clienti.length) {
    Utils.showEmptyState(container, 'Nessun cliente. Clicca "Nuovo cliente" per iniziare.', '&#128101;');
    return;
  }
  var recent = Utils.sortByName(clienti, 'nome').slice(0, 6);
  container.innerHTML = recent.map(function(c) {
    return '<div class="pos-card" style="cursor:pointer;" onclick="Utils.navigate(\'cantiere.html\',{idCliente:\'' + c.ID_cliente + '\'})">' +
      '<div class="pos-num" style="background:var(--c-red)">' + (c.nome||'?').charAt(0).toUpperCase() + '</div>' +
      '<div class="pos-info">' +
        '<div class="pos-title">' + c.nome + '</div>' +
        '<div class="pos-subtitle">' + (c.telefono||'') + (c.telefono&&c.email?' &nbsp;':'') + (c.email||'') + '</div>' +
      '</div>' +
      '<span style="color:var(--c-text-sec)">&#8250;</span>' +
    '</div>';
  }).join('');
}
</script>

<!-- FAB Guida -->
<div style="position:fixed;bottom:24px;right:24px;z-index:500;">
  <button onclick="window.open('guida.html','_blank')" title="Apri guida" style="width:48px;height:48px;border-radius:50%;background:#4f46e5;color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(79,70,229,.45);display:flex;align-items:center;justify-content:center;">&#10067;</button>
</div>
</body>
</html>
