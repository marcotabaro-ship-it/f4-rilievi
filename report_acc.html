<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Accessori &mdash; F4 Rilievi</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .rep-header {
      background: var(--c-primary); color: white;
      border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 16px;
      display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    .rep-header h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
    .rep-meta { font-size: .78rem; opacity: .85; line-height: 1.8; }
    .rep-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .section-title {
      font-size: .78rem; font-weight: 700; color: var(--c-primary);
      text-transform: uppercase; letter-spacing: .5px;
      border-bottom: 2px solid var(--c-red); padding-bottom: 4px; margin: 16px 0 12px;
    }
    .strat-list { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 8px; }
    .strat-card-rep {
      border: 1px solid var(--c-border); border-radius: var(--radius);
      overflow: hidden; width: 150px; background: white;
    }
    .strat-card-rep img { width: 100%; height: 100px; object-fit: contain; background: #F5F5F5; padding: 5px; display: block; }
    .strat-card-rep .sc-body { padding: 6px 8px; }
    .strat-card-rep .sc-name { font-size: .76rem; font-weight: 700; color: var(--c-primary); margin-bottom: 2px; }
    .strat-card-rep .sc-quote { font-size: .69rem; color: var(--c-text-sec); line-height: 1.5; }
    .acc-group {
      border: 1px solid var(--c-border); border-radius: var(--radius);
      overflow: hidden; margin-bottom: 12px; background: white;
      page-break-inside: avoid;
    }
    .acc-group-header {
      background: #F5F7FF; border-bottom: 1px solid var(--c-border);
      padding: 8px 14px; display: flex; align-items: center; gap: 12px;
    }
    .acc-group-img {
      width: 56px; height: 40px; object-fit: contain; flex-shrink: 0;
      border: 1px solid var(--c-border); border-radius: 4px; background: white; padding: 3px;
    }
    .acc-group-title { font-size: .88rem; font-weight: 700; color: var(--c-primary); flex: 1; }
    .acc-group-totale { font-size: .82rem; font-weight: 700; color: #2E7D32; white-space: nowrap; }
    .acc-group-body { padding: 10px 14px; }
    .acc-subgroup { margin-bottom: 9px; }
    .acc-subgroup:last-child { margin-bottom: 0; }
    .acc-sublabel { font-size: .76rem; font-weight: 700; color: var(--c-text-sec); margin-bottom: 4px; }
    .acc-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .chip-mq  { display:inline-block; padding:2px 10px; border-radius:12px; font-size:.8rem; font-weight:700; background:#E3F2FD; color:#1565C0; white-space:nowrap; }
    .chip-n   { display:inline-block; padding:2px 10px; border-radius:12px; font-size:.8rem; font-weight:700; background:#FFF3E0; color:#E65100; white-space:nowrap; }
    .chip-m   { display:inline-block; padding:2px 10px; border-radius:12px; font-size:.8rem; font-weight:700; background:#F3E5F5; color:#6A1B9A; white-space:nowrap; }
    .acc-pos-list {
      flex: 1; font-size: .8rem; font-weight: 600; color: var(--c-primary);
      font-family: monospace; background: #EEF2FF; padding: 3px 10px; border-radius: 4px;
      min-width: 0;
    }
    .btn-copia {
      font-size: .72rem; padding: 3px 9px; cursor: pointer;
      background: var(--c-primary); color: white; border: none; border-radius: 4px; flex-shrink: 0;
    }
    .btn-copia:hover { opacity: .85; }
    .pos-table { width: 100%; border-collapse: collapse; font-size: .78rem; }
    .pos-table th { background: var(--c-primary); color: white; padding: 6px 10px; text-align: left; font-weight: 600; font-size: .72rem; }
    .pos-table td { padding: 6px 10px; border-bottom: 1px solid var(--c-border); }
    .pos-table tr:last-child td { border-bottom: none; }
    .pos-table tr { page-break-inside: avoid; }
    .badge-t { display:inline-block; padding:1px 6px; border-radius:10px; background:#E3F2FD; color:#1565C0; font-weight:700; font-size:.72rem; }
    .totali-bar { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .tot-chip { background:#E8F5E9; color:#2E7D32; border-radius:16px; padding:2px 10px; font-size:.78rem; font-weight:600; }
    .mat-posa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; margin-top: 8px; }
    .mat-posa-card { border: 1px solid var(--c-border); border-radius: var(--radius); padding: 10px 12px; background: white; text-align: center; }
    .mat-posa-card .mp-nome { font-size: .74rem; color: var(--c-text-sec); margin-bottom: 4px; }
    .mat-posa-card .mp-val  { font-size: 1.1rem; font-weight: 700; color: var(--c-primary); }
    .mat-posa-card .mp-um   { font-size: .7rem; color: var(--c-text-sec); }
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      body { background: white; }
      .sidebar, .top-bar, .rep-actions, .btn-copia, .breadcrumb { display: none !important; }
      .main-content { padding: 0 !important; }
      .rep-header { border-radius: 0; page-break-inside: avoid; }
      .acc-group { page-break-inside: avoid; border-radius: 0; }
      .strat-card-rep { page-break-inside: avoid; }
      .section-title { page-break-after: avoid; }
      .acc-group-header { background: #EEE !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout">
  <main class="main-content">
    <div class="breadcrumb">
      <a href="clienti.html">Clienti</a> &#8250;
      <a id="bcCliente" href="#">—</a> &#8250;
      <a id="bcCantiere" href="#">—</a> &#8250;
      <span id="bcRilievo">Report Accessori</span>
    </div>
    <div id="repContent">
      <div class="loading-state"><div class="spinner"></div><p>Caricamento...</p></div>
    </div>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script>
var currentUser = Auth.requireLogin();
if (!currentUser) throw new Error('not logged');
Layout.init('clienti');

var idRilievo = Utils.getParam('idRilievo');
if (!idRilievo) window.location.href = 'clienti.html';

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function n2(x)  { return Math.round(x * 100) / 100; }
function roundUp(x) { return Math.ceil(x); }

// ================================================================
// COSTANTI
// ================================================================
var C = {
  sfrido:       50,
  pvcBarra:   6000,
  legnoBarra: 3500,
  alumBarra:  6000,
  angolPvcLato:   50,
  angolPvcBarra: 6000,
  cassIngrSx:  200,
  cassIngrDx:  200,
  scherm: {
    'A': {h:150,sx:30,dx:30,supMin:1.5}, 'AM':{h:150,sx:30,dx:30,supMin:1.5},
    'AE':{h:150,sx:30,dx:30,supMin:1.5}, 'AR':{h:150,sx:30,dx:30,supMin:1.5},
    'S': {h:0,  sx:0, dx:0, supMin:0  },
    'TZ':{h:100,sx:30,dx:30,supMin:0  }, 'TM':{h:100,sx:30,dx:30,supMin:0  },
    'CA':{h:250,sx:30,dx:30,supMin:0  }, 'CT':{h:350,sx:30,dx:30,supMin:0  }
  },
  zanz: {
    'V':{h:50,sx:50,dx:50,supMin:1.5},
    'O':{h:50,sx:50,dx:50,supMin:2.0}
  }
};

var STRAT_IMG = (typeof APP_CONFIG!=='undefined'&&APP_CONFIG.STRAT_IMAGES)?APP_CONFIG.STRAT_IMAGES:{};
var TIPO_DESC = {'I':'Ingresso','F':'Finestra apribile','PF':'Porta finestra','FF':'Finestra fissa','VF':'Vetrata fissa','S':'Scorrevole'};
var TIPO_ORD  = ['I','F','PF','FF','VF','S'];
var SCHERM_DESC = {'A':'Avvolgibile manuale','AM':'Avv. meccanico','AE':'Avv. elettronico','AR':'Avv. radio','S':'Scuretto','TZ':'Tenda ZIP','TM':'Tenda manuale','CA':'Frangisole cavo','CT':'Frangisole catena'};

// ================================================================
// CALCOLI
// ================================================================
function numPos(p)  { return p.numero_pos_alfa || p.numero_pos; }

function parseQuote(raw) {
  if (!raw) return [];
  try {
    var a = typeof raw==='string'?JSON.parse(raw):raw;
    if (Array.isArray(a)) return a.filter(function(q){return q&&q.lettera&&(q.mm||q.mm===0);});
    if (typeof a==='object') return Object.keys(a).filter(function(k){return a[k]!=null&&a[k]!=='';}).map(function(k){return{lettera:k,mm:a[k]};});
  } catch(e){}
  return [];
}

function calcTub(p, dbSerr) {
  var H=parseFloat(p.H_mm||p.h_mm)||0, L=parseFloat(p.L_mm||p.l_mm)||0;
  var tf=(p.tipo_foro||'').toUpperCase(), ts=(p.tipo_serramento||'').toUpperCase();
  if (!H||!L||!tf) return null;
  var rec=null;
  for (var i=0;i<dbSerr.length;i++) {
    var d=dbSerr[i];
    if (d&&d.materiale===p.materiale&&(d.descrizione===p.sistema||d.sistema===p.sistema)&&d.stile_design===p.stile_design&&d.variante_telaio===p.variante_telaio){rec=d;break;}
  }
  var nasc=rec?(parseFloat(rec.telaio_nascosto_mm)||0):0;
  var alet=rec?(parseFloat(rec.aletta_mm)||0):0;
  var tv  =rec?(parseFloat(rec.telaio_a_vista_mm)||0):0;
  var nAlH=(ts==='F'||ts==='FF')?2:1;
  var Ltub=0,Htub=0;
  if (tf==='A'){Ltub=L+2*nasc+2*alet;Htub=H+nasc+nAlH*alet;}
  else if(tf==='D'){Ltub=L+2*alet;Htub=H+nAlH*alet;}
  else if(tf==='P'){Ltub=L-2*tv+2*alet;Htub=H-tv+nAlH*alet;}
  return {Ltub:Ltub,Htub:Htub,nasc:nasc,alet:alet};
}

function lBarraCoprifilo(mat) {
  var m=(mat||'').toUpperCase();
  if (m.indexOf('LEG')>=0) return C.legnoBarra;
  if (m.indexOf('ALU')>=0||m.indexOf('ALL')>=0) return C.alumBarra;
  return C.pvcBarra;
}

function svCoprifilo(ts, Ltub, Htub, dim) {
  var s=C.sfrido;
  if (ts==='F'||ts==='FF') return 2*(Ltub+2*dim+s)+2*(Htub+2*dim+s);
  return 1*(Ltub+2*dim+s)+2*(Htub+1*dim+s);
}

function supScherm(ts, schCod, Ltub, Htub, nasc, alet) {
  var cfg=C.scherm[schCod]; if (!cfg) return 0;
  var nAlH=(ts==='F'||ts==='FF')?2:1;
  var Larch=Ltub-2*alet-2*nasc, Harch=Htub-nAlH*alet-nAlH*nasc;
  return Math.max((Larch+cfg.sx+cfg.dx)*(Harch+cfg.h)/1e6, cfg.supMin);
}

function supZanz(ts, zanzCod, Ltub, Htub, nasc, alet) {
  var cfg=C.zanz[zanzCod]; if (!cfg) return 0;
  var nAlH=(ts==='F'||ts==='FF')?2:1;
  var Larch=Ltub-2*alet-2*nasc, Harch=Htub-nAlH*alet-nAlH*nasc;
  var sup=Math.max((Larch+cfg.sx+cfg.dx)*(Harch+cfg.h)/1e6, cfg.supMin);
  if (ts==='S'&&zanzCod==='V') sup=sup/2;
  return sup;
}

function matPosaMetri(ts, Ltub, Htub) {
  var s=C.sfrido;
  if (ts==='F'||ts==='FF') return (2*(Ltub+2*s)+2*(Htub+2*s))/1000;
  return (1*(Ltub+2*s)+2*(Htub+2*s))/1000;
}

// ================================================================
// INIT
// ================================================================
var SUPA_URL=APP_CONFIG.SUPABASE_URL, SUPA_KEY=APP_CONFIG.SUPABASE_ANON_KEY;

function supaGet(path, cb, eb) {
  var xhr=new XMLHttpRequest();
  xhr.open('GET',SUPA_URL+'/rest/v1/'+path,true);
  xhr.setRequestHeader('apikey',SUPA_KEY);
  xhr.setRequestHeader('Authorization','Bearer '+(Auth.getToken()||SUPA_KEY));
  xhr.onload=function(){if(xhr.status>=200&&xhr.status<300){try{cb(JSON.parse(xhr.responseText));}catch(e){eb(e.message);}}else eb('HTTP '+xhr.status);};
  xhr.onerror=function(){eb('Rete');};
  xhr.send();
}

async function init() {
  try {
    var results=await Promise.all([API.getRilievo(idRilievo),API.getPosizioniSerr(idRilievo),API.getStratigrafie(idRilievo)]);
    var ril=results[0].data, pos=results[1].success?results[1].data:[], strat=results[2].success?results[2].data:[];
    if (!results[0].success){Utils.showError(results[0].error);return;}
    var cp=ril.percorsoCantiere||{};
    document.getElementById('bcCliente').textContent  = cp.nomeCliente||'—';
    document.getElementById('bcCantiere').textContent = cp.breadcrumb||'—';
    document.getElementById('bcRilievo').textContent  = ril.codice_completo||'—';
    document.title = 'Accessori '+(ril.codice_completo||'');
    supaGet(
      'db_serramento?stato=eq.attivo&select=materiale,descrizione,stile_design,variante_telaio,telaio_nascosto_mm,aletta_mm,telaio_a_vista_mm',
      function(dbSerr){renderAll(ril,pos,strat,dbSerr||[]);},
      function(){renderAll(ril,pos,strat,[]);}
    );
  } catch(e){Utils.showError(e.message||'Errore');}
}

// ================================================================
// RENDER
// ================================================================
function renderAll(ril, pos, strat, dbSerr) {
  var cp=ril.percorsoCantiere||{};
  var html='';

  // HEADER
  html+='<div class="rep-header"><div>'+
    '<h2>&#128202; Report Accessori &mdash; '+esc(ril.codice_completo||'')+'</h2>'+
    '<div class="rep-meta"><strong>'+esc(cp.nomeCliente||'—')+'</strong> &mdash; '+esc(cp.breadcrumb||'—')+'<br>'+
    'Intervento: '+esc(ril.intervento||'—')+' &nbsp;|&nbsp; Referente: '+esc(ril.referente||'—')+
    ' &nbsp;|&nbsp; Data rilievo: '+esc(ril.data_rilievo||'—')+'</div></div>'+
    '<div class="rep-actions">'+
    '<button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:white;" onclick="window.print()">&#128438; Stampa</button>'+
    '<button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:white;" onclick="history.back()">&#8592; Torna</button>'+
    '</div></div>';

  if (!pos.length) {
    html+='<div style="text-align:center;padding:60px;color:var(--c-text-sec);">Nessuna posizione.</div>';
    document.getElementById('repContent').innerHTML=html; return;
  }

  // PRE-CALCOLA
  var posCalc=pos.map(function(p){
    var tub=calcTub(p,dbSerr);
    var ts=(p.tipo_serramento||'').toUpperCase();
    var _supScherm=0,_supZanz=0,_svCI=0,_barCI=0,_svCE=0,_barCE=0;
    var _schiuma=0,_msPol=0,_bg1=0,_multi=0,_barVap=0,_viti=0,_cassM=0;
    if (tub) {
      var Lt=tub.Ltub,Ht=tub.Htub,nasc=tub.nasc,alet=tub.alet;
      if (p.schermatura) _supScherm=supScherm(ts,p.schermatura,Lt,Ht,nasc,alet);
      if (p.zanzariera)  _supZanz  =supZanz(ts,p.zanzariera,Lt,Ht,nasc,alet);
      if (p.coprifilo_int_mat){_svCI=svCoprifilo(ts,Lt,Ht,parseFloat(p.coprifilo_int_dim)||0);_barCI=roundUp(_svCI/lBarraCoprifilo(p.coprifilo_int_mat));}
      if (p.coprifilo_est_mat){_svCE=svCoprifilo(ts,Lt,Ht,parseFloat(p.coprifilo_est_dim)||0);_barCE=roundUp(_svCE/lBarraCoprifilo(p.coprifilo_est_mat));}
      _schiuma=matPosaMetri(ts,Lt,Ht); _bg1=_schiuma; _multi=_schiuma; _barVap=_schiuma;
      _msPol=1; _viti=1;
      _cassM=(Lt+C.cassIngrSx+C.cassIngrDx)/1000;
    }
    return Object.assign({},p,{_tub:tub,_ts:ts,_supScherm:_supScherm,_supZanz:_supZanz,
      _svCI:_svCI,_barCI:_barCI,_svCE:_svCE,_barCE:_barCE,
      _schiuma:_schiuma,_msPol:_msPol,_bg1:_bg1,_multi:_multi,_barVap:_barVap,_viti:_viti,_cassM:_cassM});
  });

  // STRATIGRAFIE
  if (strat.length) {
    html+='<div class="section-title">&#128247; Stratigrafie</div><div class="strat-list">';
    strat.forEach(function(s){
      var imgSrc=STRAT_IMG[s.immagine_ref]||STRAT_IMG['SERR_'+(s.immagine_ref||'')]||'';
      var quotes=parseQuote(s.quote_json);
      var qStr=quotes.map(function(q){return q.lettera+': '+q.mm+' mm';}).join(' | ');
      html+='<div class="strat-card-rep">';
      if (imgSrc) html+='<img src="'+esc(imgSrc)+'" alt="" onerror="this.style.display=\'none\'">';
      html+='<div class="sc-body"><div class="sc-name">'+esc(s.nome)+(s.is_default==='SI'?' <span style="font-size:.65rem;background:#d1fae5;color:#065f46;padding:1px 4px;border-radius:6px;">def</span>':'')+'</div>';
      if (qStr) html+='<div class="sc-quote">'+esc(qStr)+'</div>';
      html+='</div></div>';
    });
    html+='</div>';
  }

  // RIEPILOGO POSIZIONI
  html+='<div class="section-title">&#128203; Riepilogo posizioni ('+pos.length+')</div>';
  html+='<div style="overflow-x:auto;"><table class="pos-table"><thead><tr>'+
    '<th>N&deg;</th><th>Piano</th><th>Ambiente</th><th>Tipo</th>'+
    '<th>L (mm)</th><th>H (mm)</th><th>Foro</th><th>Sistema</th>'+
    '<th>Coprifilo int.</th><th>Coprifilo est.</th></tr></thead><tbody>';
  posCalc.forEach(function(p){
    var piano=(p.piano!==undefined&&p.piano!==null)?('P'+(parseInt(p.piano)>=0?'+':'')+p.piano):'—';
    html+='<tr>'+
      '<td style="font-weight:700;font-family:monospace;">'+esc(String(numPos(p)))+'</td>'+
      '<td>'+piano+'</td><td>'+esc(p.ambiente||'—')+'</td>'+
      '<td><span class="badge-t">'+esc(p.tipo_serramento||'—')+'</span></td>'+
      '<td>'+(p.L_mm||p.l_mm||'—')+'</td><td>'+(p.H_mm||p.h_mm||'—')+'</td>'+
      '<td>'+esc(p.tipo_foro||'—')+'</td>'+
      '<td style="font-size:.74rem;">'+esc(p.sistema||'—')+'</td>'+
      '<td style="font-size:.74rem;">'+esc(p.coprifilo_int_mat?p.coprifilo_int_mat+' '+p.coprifilo_int_dim+' mm':'—')+'</td>'+
      '<td style="font-size:.74rem;">'+esc(p.coprifilo_est_mat?p.coprifilo_est_mat+' '+p.coprifilo_est_dim+' mm':'—')+'</td>'+
      '</tr>';
  });
  html+='</tbody></table></div>';
  var ct={}; posCalc.forEach(function(p){var t=p.tipo_serramento||'?';ct[t]=(ct[t]||0)+1;});
  var tpres=TIPO_ORD.filter(function(t){return ct[t];});
  if (tpres.length){
    html+='<div class="totali-bar">';
    tpres.forEach(function(t){html+='<span class="tot-chip"><span class="badge-t">'+t+'</span> '+(TIPO_DESC[t]||t)+': '+ct[t]+'</span>';});
    html+='</div>';
  }

  html+='<div class="section-title">&#128295; Dettaglio accessori</div>';

  // ================================================================
  // COPRIFILI INTERNI
  // ================================================================
  var copiMap={};
  posCalc.forEach(function(p){
    if (!p.coprifilo_int_mat) return;
    var k=p.coprifilo_int_mat.toUpperCase()+'|'+(p.coprifilo_int_dim||'');
    if (!copiMap[k]) copiMap[k]={mat:p.coprifilo_int_mat,dim:p.coprifilo_int_dim||'—',barre:0,pos:[]};
    copiMap[k].barre+=p._barCI; copiMap[k].pos.push(numPos(p));
  });
  if (Object.keys(copiMap).length) {
    var totBI=0; Object.values(copiMap).forEach(function(v){totBI+=v.barre;});
    html+=mkGruppo('Coprifili interni','',totBI+' barre TOT.',
      Object.values(copiMap).map(function(v){
        return {label:v.mat+' &mdash; '+v.dim+' mm',
          chipHtml:'<span class="chip-n">'+v.barre+' barre</span>',pos:v.pos};
      })
    );
  }

  // ================================================================
  // COPRIFILI ESTERNI
  // ================================================================
  var copeMap={};
  posCalc.forEach(function(p){
    if (!p.coprifilo_est_mat) return;
    var k=p.coprifilo_est_mat.toUpperCase()+'|'+(p.coprifilo_est_dim||'');
    if (!copeMap[k]) copeMap[k]={mat:p.coprifilo_est_mat,dim:p.coprifilo_est_dim||'—',barre:0,pos:[]};
    copeMap[k].barre+=p._barCE; copeMap[k].pos.push(numPos(p));
  });
  if (Object.keys(copeMap).length) {
    var totBE=0; Object.values(copeMap).forEach(function(v){totBE+=v.barre;});
    html+=mkGruppo('Coprifili esterni','',totBE+' barre TOT.',
      Object.values(copeMap).map(function(v){
        return {label:v.mat+' &mdash; '+v.dim+' mm',
          chipHtml:'<span class="chip-n">'+v.barre+' barre</span>',pos:v.pos};
      })
    );
  }

  // ================================================================
  // AVVOLGIBILE (A, AM, AE, AR)
  // ================================================================
  var avolTypes=['A','AM','AE','AR'];
  var avolMap={};
  posCalc.forEach(function(p){
    if (!p.schermatura||avolTypes.indexOf(p.schermatura)<0) return;
    var k=p.schermatura;
    if (!avolMap[k]) avolMap[k]={sup:0,n:0,pos:[]};
    avolMap[k].sup+=p._supScherm; avolMap[k].n++; avolMap[k].pos.push(numPos(p));
  });
  if (Object.keys(avolMap).length) {
    var totAvolMq=0,totAvolN=0;
    Object.values(avolMap).forEach(function(v){totAvolMq+=v.sup;totAvolN+=v.n;});
    var ordAv=avolTypes.filter(function(k){return avolMap[k];});
    html+=mkGruppo('Avvolgibile','img/Avvolgibile.jpeg',n2(totAvolMq)+' mq TOT. &mdash; '+totAvolN+' pz',
      ordAv.map(function(k){
        var v=avolMap[k];
        return {label:(SCHERM_DESC[k]||k),
          chipHtml:'<span class="chip-mq">'+n2(v.sup)+' mq</span> <span class="chip-n">'+v.n+' pz</span>',
          pos:v.pos};
      })
    );
  }

  // ================================================================
  // SCURETTO (S)
  // ================================================================
  var scuPos=posCalc.filter(function(p){return p.schermatura==='S';});
  if (scuPos.length) {
    html+=mkGruppo('Scuretto','img/Scuretto.jpeg',scuPos.length+' pz TOT.',
      [{label:'Scuretto',chipHtml:'<span class="chip-n">'+scuPos.length+' pz</span>',pos:scuPos.map(numPos)}]
    );
  }

  // ================================================================
  // TENDA (TZ, TM)
  // ================================================================
  var tendaTypes=['TZ','TM'];
  var tendaMap={};
  posCalc.forEach(function(p){
    if (!p.schermatura||tendaTypes.indexOf(p.schermatura)<0) return;
    var k=p.schermatura;
    if (!tendaMap[k]) tendaMap[k]={n:0,pos:[]};
    tendaMap[k].n++; tendaMap[k].pos.push(numPos(p));
  });
  if (Object.keys(tendaMap).length) {
    var totTN=0; Object.values(tendaMap).forEach(function(v){totTN+=v.n;});
    var ordTe=tendaTypes.filter(function(k){return tendaMap[k];});
    html+=mkGruppo('Tenda','img/Tenda_zip.jpeg',totTN+' pz TOT.',
      ordTe.map(function(k){
        var v=tendaMap[k];
        return {label:(SCHERM_DESC[k]||k),chipHtml:'<span class="chip-n">'+v.n+' pz</span>',pos:v.pos};
      })
    );
  }

  // ================================================================
  // FRANGISOLE (CA, CT)
  // ================================================================
  var frangTypes=['CA','CT'];
  var frangMap={};
  posCalc.forEach(function(p){
    if (!p.schermatura||frangTypes.indexOf(p.schermatura)<0) return;
    var k=p.schermatura;
    if (!frangMap[k]) frangMap[k]={n:0,pos:[]};
    frangMap[k].n++; frangMap[k].pos.push(numPos(p));
  });
  if (Object.keys(frangMap).length) {
    var totFN=0; Object.values(frangMap).forEach(function(v){totFN+=v.n;});
    var ordFr=frangTypes.filter(function(k){return frangMap[k];});
    html+=mkGruppo('Frangisole','img/Frangisole.jpeg',totFN+' pz TOT.',
      ordFr.map(function(k){
        var v=frangMap[k];
        return {label:(SCHERM_DESC[k]||k),chipHtml:'<span class="chip-n">'+v.n+' pz</span>',pos:v.pos};
      })
    );
  }

  // ================================================================
  // CONTROTELAIO LEGNO (L) — suddiviso per tipo serramento
  // ================================================================
  var ctlLMap={};
  posCalc.forEach(function(p){
    if (p.controtelaio!=='L') return;
    var ts=p.tipo_serramento||'?';
    if (!ctlLMap[ts]) ctlLMap[ts]={n:0,pos:[]};
    ctlLMap[ts].n++; ctlLMap[ts].pos.push(numPos(p));
  });
  if (Object.keys(ctlLMap).length) {
    var totCL=0; Object.values(ctlLMap).forEach(function(v){totCL+=v.n;});
    var ordCL=TIPO_ORD.filter(function(t){return ctlLMap[t];});
    html+=mkGruppo('Controtelaio legno','img/Controtelaio_legno.png',totCL+' pz TOT.',
      ordCL.map(function(t){
        var v=ctlLMap[t];
        return {label:(TIPO_DESC[t]||t),chipHtml:'<span class="chip-n">'+v.n+' pz</span>',pos:v.pos};
      })
    );
  }

  // ================================================================
  // TERMOCASSA (T) — suddivisa per tipo serramento
  // ================================================================
  var ctlTMap={};
  posCalc.forEach(function(p){
    if (p.controtelaio!=='T') return;
    var ts=p.tipo_serramento||'?';
    if (!ctlTMap[ts]) ctlTMap[ts]={n:0,pos:[]};
    ctlTMap[ts].n++; ctlTMap[ts].pos.push(numPos(p));
  });
  if (Object.keys(ctlTMap).length) {
    var totCT=0; Object.values(ctlTMap).forEach(function(v){totCT+=v.n;});
    var ordCT=TIPO_ORD.filter(function(t){return ctlTMap[t];});
    html+=mkGruppo('Termocassa','img/Termocassa.jpeg',totCT+' pz TOT.',
      ordCT.map(function(t){
        var v=ctlTMap[t];
        return {label:(TIPO_DESC[t]||t),chipHtml:'<span class="chip-n">'+v.n+' pz</span>',pos:v.pos};
      })
    );
  }

  // ================================================================
  // CASSONETTO — per materiale in metri
  // ================================================================
  var cassDesc={'P':'PVC','L':'Legno'};
  var cassMap={};
  posCalc.forEach(function(p){
    if (!p.cassonetto) return;
    var k=p.cassonetto;
    if (!cassMap[k]) cassMap[k]={m:0,pos:[]};
    cassMap[k].m+=p._cassM; cassMap[k].pos.push(numPos(p));
  });
  if (Object.keys(cassMap).length) {
    var totCassM=0; Object.values(cassMap).forEach(function(v){totCassM+=v.m;});
    html+=mkGruppo('Cassonetto','img/Cassonetto_PVC.webp',n2(totCassM)+' m TOT.',
      Object.keys(cassMap).map(function(k){
        var v=cassMap[k];
        return {label:'Cassonetto '+(cassDesc[k]||k),
          chipHtml:'<span class="chip-m">'+n2(v.m)+' m</span>',pos:v.pos};
      })
    );
  }

  // ================================================================
  // ZANZARIERA
  // ================================================================
  var zanzDesc={'V':'Verticale','O':'Orizzontale'};
  var zanzMap={};
  posCalc.forEach(function(p){
    if (!p.zanzariera) return;
    var k=p.zanzariera;
    if (!zanzMap[k]) zanzMap[k]={sup:0,n:0,pos:[]};
    zanzMap[k].sup+=p._supZanz; zanzMap[k].n++; zanzMap[k].pos.push(numPos(p));
  });
  if (Object.keys(zanzMap).length) {
    var totZM=0; Object.values(zanzMap).forEach(function(v){totZM+=v.sup;});
    html+=mkGruppo('Zanzariera','img/Zanzariera.jpeg',n2(totZM)+' mq TOT.',
      Object.keys(zanzMap).map(function(k){
        var v=zanzMap[k];
        return {label:(zanzDesc[k]||k),
          chipHtml:'<span class="chip-mq">'+n2(v.sup)+' mq</span> <span class="chip-n">'+v.n+' pz</span>',
          pos:v.pos};
      })
    );
  }

  // ================================================================
  // DINOX — per tipo
  // ================================================================
  var dinDesc={'DA':'Davanzale','I3':'Imbotte 3 lati','I4':'Imbotte 4 lati'};
  var dinOrd=['DA','I3','I4'];
  var dinMap={};
  posCalc.forEach(function(p){
    if (!p.dinoxill) return;
    var k=p.dinoxill;
    if (!dinMap[k]) dinMap[k]={n:0,pos:[]};
    dinMap[k].n++; dinMap[k].pos.push(numPos(p));
  });
  if (Object.keys(dinMap).length) {
    var totDN=0; Object.values(dinMap).forEach(function(v){totDN+=v.n;});
    var ordDin=dinOrd.filter(function(k){return dinMap[k];});
    html+=mkGruppo('Dinoxill','',totDN+' pz TOT.',
      ordDin.map(function(k){
        var v=dinMap[k];
        return {label:(dinDesc[k]||k)+(dinMap[k]&&(k==='I3'||k==='I4')&&posCalc.some(function(p){return p.dinoxill===k&&p.dinoxill_lati;})?' ('+posCalc.find(function(p){return p.dinoxill===k&&p.dinoxill_lati;}).dinoxill_lati+' lati)':''),
          chipHtml:'<span class="chip-n">'+v.n+' pz</span>',pos:v.pos};
      })
    );
  }

  // ================================================================
  // ANGOLARI PVC
  // ================================================================
  var angPoss=posCalc.filter(function(p){return p.angolari_pvc===true;});
  if (angPoss.length) {
    var totBarreAng=0;
    angPoss.forEach(function(p){
      if (p._tub){var sv=svCoprifilo(p._ts,p._tub.Ltub,p._tub.Htub,C.angolPvcLato);totBarreAng+=roundUp(sv/C.angolPvcBarra);}
    });
    html+=mkGruppo('Angolari PVC','',angPoss.length+' pos. &mdash; '+totBarreAng+' barre',
      [{label:'Angolari PVC 50 mm',
        chipHtml:'<span class="chip-n">'+angPoss.length+' pos.</span> <span class="chip-n">'+totBarreAng+' barre</span>',
        pos:angPoss.map(numPos)}]
    );
  }

  // ================================================================
  // RIMOZIONE / TAGLIO
  // ================================================================
  var rimS=posCalc.filter(function(p){return p.rimozione==='SI'||p.rimozione===true;});
  var rimA=posCalc.filter(function(p){return p.rimozione_accessori===true;});
  var mrm =posCalc.filter(function(p){return p.taglio_marmo===true;});
  if (rimS.length||rimA.length||mrm.length) {
    var subRim=[];
    if (rimS.length) subRim.push({label:'Rimozione serramento esistente',chipHtml:'<span class="chip-n">'+rimS.length+' pz</span>',pos:rimS.map(numPos)});
    if (rimA.length) subRim.push({label:'Rimozione accessori esistenti', chipHtml:'<span class="chip-n">'+rimA.length+' pz</span>',pos:rimA.map(numPos)});
    if (mrm.length)  subRim.push({label:'Taglio piani marmo',            chipHtml:'<span class="chip-n">'+mrm.length+' pz</span>',pos:mrm.map(numPos)});
    html+=mkGruppo('Rimozione / Taglio','', (rimS.length+rimA.length+mrm.length)+' interventi',subRim);
  }

  // ================================================================
  // MATERIALI DI POSA
  // ================================================================
  var totSch=0,totPol=0,totBG1=0,totMul=0,totBV=0,totViti=0;
  posCalc.forEach(function(p){totSch+=p._schiuma;totPol+=p._msPol;totBG1+=p._bg1;totMul+=p._multi;totBV+=p._barVap;totViti+=p._viti;});
  var totLin=n2(totSch+totBG1+totMul+totBV);
  html+='<div class="acc-group">'+
    '<div class="acc-group-header">'+
    '<img class="acc-group-img" src="img/Posa.jpeg" alt="Posa" onerror="this.style.display=\'none\'">'+
    '<div class="acc-group-title">Materiali di posa</div>'+
    '<div class="acc-group-totale">Tot. lineari: '+totLin+' m</div>'+
    '</div><div class="acc-group-body"><div class="mat-posa-grid">';
  [{nome:'Schiuma',val:n2(totSch),um:'m'},{nome:'MS Polimero',val:totPol,um:'flac.'},
   {nome:'Nastro BG1',val:n2(totBG1),um:'m'},{nome:'Nastro Multi',val:n2(totMul),um:'m'},
   {nome:'Barriera vapore',val:n2(totBV),um:'m'},{nome:'Viti 1 kit',val:totViti,um:'kit'},
   {nome:'Tot. lineare',val:totLin,um:'m'}
  ].forEach(function(item){
    html+='<div class="mat-posa-card"><div class="mp-nome">'+item.nome+'</div>'+
      '<div class="mp-val">'+item.val+'</div><div class="mp-um">'+item.um+'</div></div>';
  });
  html+='</div></div></div>';

  document.getElementById('repContent').innerHTML=html;
}

// ================================================================
// HELPER mkGruppo
// ================================================================
function mkGruppo(titolo, img, totLabel, subs) {
  var h='<div class="acc-group"><div class="acc-group-header">';
  if (img) h+='<img class="acc-group-img" src="'+esc(img)+'" alt="" onerror="this.style.display=\'none\'">';
  else h+='<div style="width:56px;height:40px;flex-shrink:0;"></div>';
  h+='<div class="acc-group-title">'+esc(titolo)+'</div>';
  h+='<div class="acc-group-totale">'+totLabel+'</div>';
  h+='</div><div class="acc-group-body">';
  subs.forEach(function(s){
    var posStr=s.pos.map(function(x){return String(x);}).join(', ');
    h+='<div class="acc-subgroup">';
    if (subs.length>1) h+='<div class="acc-sublabel">'+s.label+'</div>';
    h+='<div class="acc-row">'+s.chipHtml;
    h+='<div class="acc-pos-list">Pos: '+esc(posStr)+'</div>';
    h+='<button class="btn-copia" onclick="copia(\''+posStr.replace(/'/g,"\\'")+'\')" title="Copia">&#128203;</button>';
    h+='</div></div>';
  });
  h+='</div></div>';
  return h;
}

function copia(txt) {
  if (navigator.clipboard&&navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){Utils.showSuccess('Copiato: '+txt);});
  } else {
    var el=document.createElement('textarea');el.value=txt;
    document.body.appendChild(el);el.select();
    document.execCommand('copy');document.body.removeChild(el);
    Utils.showSuccess('Copiato: '+txt);
  }
}

init();
</script>
